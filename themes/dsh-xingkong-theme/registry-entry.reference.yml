  - https://raw.githubusercontent.com/sayzwx/DSH-desktop/HEAD/themes/dsh-xingkong-theme/docs/screenshots/dark.jpg
  - https://raw.githubusercontent.com/sayzwx/DSH-desktop/HEAD/themes/dsh-xingkong-theme/docs/screenshots/model-probe.jpg